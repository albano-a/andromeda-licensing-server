services:
    db:
        image: postgres:16
        environment:
            POSTGRES_USER: andromeda
            POSTGRES_PASSWORD: andromeda
            POSTGRES_DB: andromeda_license
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U andromeda -d andromeda_license"]
            interval: 5s
            timeout: 5s
            retries: 10

    app:
        build: ./server
        environment:
            DATABASE_URL: postgresql+psycopg2://andromeda:andromeda@db:5432/andromeda_license
            PRIVATE_KEY_PATH: /run/secrets/private_key.pem
            SESSION_SECRET: ${SESSION_SECRET}
            ADMIN_USERNAME: ${ADMIN_USERNAME}
            ADMIN_PASSWORD: ${ADMIN_PASSWORD}
        ports:
            - "4127:8000"
        depends_on:
            db:
                condition: service_healthy

volumes:
    pgdata:
