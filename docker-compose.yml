services:
    db:
        image: postgres:16
        environment:
            POSTGRES_USER: andromeda
            POSTGRES_PASSWORD: andromeda
            POSTGRES_DB: andromeda_license
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U andromeda"]
            interval: 5s
            timeout: 5s
            retries: 10

    app:
        build: ./server
        env_file: .env
        ports:
            - "4127:8000"
        depends_on:
            db:
                condition: service_healthy

volumes:
    pgdata:
