<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8" />
        <title>{% block title %}Andromeda License{% endblock %}</title>
        <link rel="stylesheet" href="/static/style.css" />
    </head>
    <body>
        <header>
            <span class="brand">Andromeda License</span>
            {% if username %}
            <nav>
                <a href="/dashboard">Licenças</a>
                <a href="/admins">Admins</a>
                <span class="user">{{ username }}</span>
                <form action="/logout" method="post" style="display: inline">
                    <button type="submit">Sair</button>
                </form>
            </nav>
            {% endif %}
        </header>
        <main>{% block content %}{% endblock %}</main>
    </body>
</html>
